name: Build Android app
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: '11076708'
      - name: Install Android SDK packages
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Keep the signing key for future updates
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: salary-signing-key-v1
      - name: Check mobile screens
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
          node tests/mobile.cjs
      - name: Save screen previews
        uses: actions/upload-artifact@v4
        with:
          name: Salary-screen-previews
          path: previews/
      - name: Build and check Android app
        run: gradle assembleDebug lintDebug --no-daemon
      - name: Save installation file
        uses: actions/upload-artifact@v4
        with:
          name: Salary-Android-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
