name: Build Android app
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: '11076708'
      - name: Install Android SDK packages
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Keep the signing key for future updates
        uses: actions/cache@v4
        with:
          path: .signing/salary.keystore
          key: salary-signing-key-v2
      - name: Prepare app signing key
        run: |
          mkdir -p .signing
          if [ ! -f .signing/salary.keystore ]; then
            keytool -genkeypair -keystore .signing/salary.keystore -storepass android -alias androiddebugkey -keypass android -dname "CN=Salary Tracker" -keyalg RSA -keysize 2048 -validity 10000
          fi
      - name: Check mobile screens
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
          node tests/mobile.cjs
          node tests/v2.cjs
          node tests/v3.cjs
          node tests/v31.cjs
          node tests/v32.cjs
          node tests/v33.cjs
      - name: Save screen previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Salary-screen-previews
          path: previews/
      - name: Build and check Android app
        run: gradle testDebugUnitTest assembleDebug lintDebug --no-daemon
      - name: Save installation file
        uses: actions/upload-artifact@v4
        with:
          name: Salary-Android-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Make room for the Android 16 emulator
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk/ndk
          df -h .
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Check Android 16 system-bar spacing
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_7
          disk-size: 2G
          emulator-boot-timeout: 180
          script: python3 tests/native_safe_area.py
      - name: Save Android screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Salary-native-previews
          path: native-previews/
