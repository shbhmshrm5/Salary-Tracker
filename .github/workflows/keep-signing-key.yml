name: Keep signing key
# GitHub deletes caches unused for 7 days. The app's signing key lives in a cache,
# and a new key would stop phones from updating the installed app, so touch it regularly.
on:
  schedule:
    - cron: '17 4 */3 * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  touch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Restore the signing key cache
        id: key
        uses: actions/cache/restore@v4
        with:
          path: .signing/salary.keystore
          key: salary-signing-key-v2
      - name: Report
        run: |
          if [ "${{ steps.key.outputs.cache-hit }}" != "true" ]; then
            echo "::warning::Signing key cache is missing; the next build will create a new key."
          else
            echo "Signing key cache is present."
          fi
