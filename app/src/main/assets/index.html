<!doctype html>
<html lang="en" data-theme="blue">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="color-scheme" content="light dark" />
    <title>Salary Tracker</title>
    <link rel="stylesheet" href="app.css" />
  </head>
  <body>
    <div id="app">
      <header id="header"></header>
      <main id="main"></main>
      <div id="homeActions" class="home-actions"></div>
      <nav id="navigation" aria-label="Main navigation"></nav>
    </div>
    <dialog id="panel" aria-labelledby="panelTitle">
      <div class="panel-head">
        <button id="panelBack" class="icon-button" aria-label="Back">←</button>
        <h2 id="panelTitle"></h2>
      </div>
      <div id="panelBody"></div>
    </dialog>
    <div id="toast" role="status" aria-live="polite"></div>
    <input
      id="importFile"
      type="file"
      accept=".json,.csv,application/json,text/csv"
      hidden
    />
    <script src="ledger.js"></script>
    <script src="io.js"></script>
    <script src="app.js"></script>
  </body>
</html>
