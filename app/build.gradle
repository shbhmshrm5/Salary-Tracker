plugins { id 'com.android.application' }
android {
 namespace 'com.shubham.salarytracker'
 compileSdk 35
 signingConfigs {
  release {
   if (System.getenv('SALARY_RELEASE_KEYSTORE')) {
    storeFile file(System.getenv('SALARY_RELEASE_KEYSTORE'))
    storePassword System.getenv('SALARY_RELEASE_STORE_PASSWORD')
    keyAlias System.getenv('SALARY_RELEASE_KEY_ALIAS')
    keyPassword System.getenv('SALARY_RELEASE_KEY_PASSWORD')
   }
  }
 }
 buildTypes {
  debug { /* Android's ephemeral local debug key; never distribute as a release. */ }
  release { signingConfig signingConfigs.release }
 }
 defaultConfig { applicationId 'com.shubham.salarytracker'; minSdk 26; targetSdk 35; versionCode 25; versionName '4.4' }
 splits {
  abi {
   enable true
   reset()
   include 'arm64-v8a', 'armeabi-v7a', 'x86', 'x86_64'
   universalApk true
  }
 }
}

gradle.taskGraph.whenReady { graph ->
 if (graph.allTasks.any { it.name in ['assembleRelease','bundleRelease','packageRelease'] }) {
  def required=['SALARY_RELEASE_KEYSTORE','SALARY_RELEASE_STORE_PASSWORD','SALARY_RELEASE_KEY_ALIAS','SALARY_RELEASE_KEY_PASSWORD']
  if (required.any { !System.getenv(it) }) throw new GradleException('A release build requires a private release keystore and signing credentials.')
 }
}

dependencies { implementation 'com.google.mlkit:text-recognition:16.0.1'; implementation 'androidx.work:work-runtime:2.10.1'; implementation 'com.google.android.gms:play-services-auth:22.0.0'; testImplementation 'junit:junit:4.13.2'; testImplementation 'org.robolectric:robolectric:4.14.1' }
